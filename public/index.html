<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bancada WhatsApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="banner" class="banner" hidden></div>
    <div class="shell" id="shell" data-view="list">
      <aside class="side" aria-label="Conversas">
        <header class="brand">
          <h1>Bancada</h1>
          <p id="tenant" class="mono"></p>
        </header>
        <form id="new-form" class="new">
          <label for="new-number">Número de destino</label>
          <div class="new-row">
            <input id="new-number" class="mono" inputmode="numeric" autocomplete="off" placeholder="5511999999999" />
            <button type="submit" class="btn solid">Abrir</button>
          </div>
          <button type="button" id="check" class="link">Verificar se tem WhatsApp</button>
          <p id="check-result" class="hint" role="status"></p>
          <button type="button" id="open-batch" class="link">Envio em lote</button>
        </form>
        <ul id="conversations" class="conversations"></ul>
      </aside>

      <main class="chat">
        <header class="chat-head">
          <button type="button" id="back" class="btn back">Conversas</button>
          <div class="chat-title">
            <h2 id="chat-title">Nenhuma conversa aberta</h2>
            <p id="chat-sub" class="mono"></p>
          </div>
          <button type="button" id="open-inspector" class="btn back">Painel</button>
        </header>
        <div id="messages" class="messages" aria-live="polite"></div>
        <section id="batch" class="batch" aria-label="Envio em lote" hidden>
          <form id="batch-form" class="batch-form">
            <label for="batch-list">Destinatários</label>
            <textarea id="batch-list" class="mono" rows="6" autocomplete="off" placeholder="5511999999999;Maria&#10;5521988887777;João"></textarea>
            <p class="hint">Um por linha, com o nome depois de <code>;</code> para usar <code>{nome}</code>. Máximo de 80.</p>
            <label for="batch-text">Mensagem</label>
            <textarea id="batch-text" rows="3" placeholder="Olá, {nome}!"></textarea>
            <p class="hint">Texto igual para muita gente é risco de ban: use <code>{nome}</code>.</p>
            <div id="batch-attachment" class="attachment" hidden></div>
            <div class="batch-actions">
              <label class="btn attach">
                Anexar
                <input id="batch-file" type="file" hidden />
              </label>
              <button type="button" id="batch-check" class="btn">Verificar números</button>
              <button type="submit" id="batch-send" class="btn solid" disabled>Enviar</button>
            </div>
            <p id="batch-error" class="send-error" role="alert" hidden></p>
          </form>
          <div id="batch-review"></div>
          <div id="batch-progress"></div>
          <h3 class="batch-title">Lotes enviados</h3>
          <ul id="batch-history" class="batch-history"></ul>
        </section>
        <form id="composer" class="composer" hidden>
          <p id="send-error" class="send-error" role="alert" hidden></p>
          <div id="attachment" class="attachment" hidden></div>
          <div class="composer-row">
            <label class="btn attach">
              Anexar
              <input id="file" type="file" hidden />
            </label>
            <textarea id="text" rows="1" placeholder="Escreva a mensagem" aria-label="Mensagem"></textarea>
            <button type="submit" id="send" class="btn solid">Enviar</button>
          </div>
        </form>
      </main>

      <aside class="inspector" aria-label="Painel do gateway">
        <button type="button" id="close-inspector" class="btn back">Voltar ao chat</button>
        <section>
          <h3>Pool <span id="pool-state" class="tag"></span></h3>
          <div id="pool"></div>
        </section>
        <section id="selected-section" hidden>
          <h3>Mensagem</h3>
          <div id="selected"></div>
        </section>
        <section class="events-section">
          <h3>Webhooks recebidos</h3>
          <div id="events" class="events"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
